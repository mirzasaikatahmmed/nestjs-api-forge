name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint 10 requires Node >= 20.19, so lint runs on the newest Node only
      - name: Lint
        if: matrix.node == 22
        run: npm run lint:check

      - name: Check formatting
        if: matrix.node == 22
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build API docs
        if: matrix.node == 22
        run: npm run docs

      - name: Test
        run: npm test

  nest-compat:
    name: NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: 9
            node: 22
          - nest: 10
            node: 22
          - nest: 11
            node: 22
          # NestJS 12 is ESM-only; Jest needs Node >= 24.9 plus --experimental-vm-modules
          - nest: 12
            node: 24
            node_options: --experimental-vm-modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json declares support for Nest 9-12, so verify against each major
      - name: Install NestJS ${{ matrix.nest }}
        run: >
          npm install --no-save --ignore-scripts
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/platform-express@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Unset for Nest 9-11; required so Jest can require(esm) NestJS 12
          NODE_OPTIONS: ${{ matrix.node_options }}
